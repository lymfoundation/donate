<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LYM Foundation" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>LYM Foundation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0a0a0a; --card:#111; --border:#222;
      --lym:#f5c518; --gold:#f5c518; --red:#e03030;
      --white:#f0f0f0; --muted:#666; --green:#3ab57a; --orange:#ff8c00;
      --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; background:var(--bg); color:var(--white); font-family:'DM Sans',sans-serif; overscroll-behavior:none; }
    #app { display:flex; flex-direction:column; height:100vh; height:100dvh; padding-top:var(--safe-top); }
    .header { flex-shrink:0; background:#0a0a0a; border-bottom:2px solid var(--lym); }
    .header-logo-wrap { display:flex; flex-direction:column; align-items:center; padding:10px 16px 4px; }
    .logo-main { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--white); letter-spacing:3px; line-height:1; }
    .logo-main span { color:var(--lym); }
    .logo-sub { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
    .header-action-bar { display:flex; justify-content:flex-end; padding:0 16px 8px; min-height:28px; }
    .content { flex:1; overflow-y:auto; padding:16px 16px calc(80px + var(--safe-bottom)); -webkit-overflow-scrolling:touch; }
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#0d0d0d; border-top:1px solid var(--border); display:flex; padding-bottom:var(--safe-bottom); z-index:50; }
    .bottom-nav button { flex:1; background:none; border:none; color:var(--muted); padding:10px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-family:'DM Sans',sans-serif; font-size:10px; font-weight:500; cursor:pointer; }
    .bottom-nav button.active { color:var(--lym); }
    .bottom-nav button svg { width:20px; height:20px; }
    .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:4px; }
    .stat-value { font-family:'Bebas Neue',sans-serif; font-size:32px; line-height:1; }
    .lym { color:var(--lym); } .gold { color:var(--gold); } .green { color:var(--green); } .red { color:var(--red); }
    .section-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; margin-top:4px; }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1px; color:var(--lym); }
    .btn { border:none; border-radius:8px; padding:9px 16px; cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; }
    .btn-lym { background:var(--gold); color:#000; }
    .btn-gold { background:var(--gold); color:#000; }
    .btn-outline { background:none; border:1px solid var(--border); color:var(--white); }
    .btn-green { background:#0a2a15; color:var(--green); border:1px solid var(--green); }
    .btn-red { background:#2a0000; color:var(--red); border:1px solid var(--red); }
    .btn-sm { padding:6px 12px; font-size:12px; }
    .card-list { display:flex; flex-direction:column; gap:8px; }
    .item-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
    .item-card:active { background:#1a1a1a; }
    .item-name { font-weight:600; font-size:15px; margin-bottom:2px; }
    .item-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; }
    .badge-pending { background:#2a1800; color:var(--orange); }
    .badge-confirmed { background:#0a2a15; color:var(--green); }
    .badge-scholarship { background:#1a1600; color:var(--lym); }
    .badge-grant { background:#1a1600; color:var(--gold); }
    .badge-corporate { background:#1a0d2a; color:#b066ff; }
    .alert-banner { border-radius:12px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; font-size:13px; }
    .alert-orange { background:#2a1800; border:1px solid var(--orange); color:var(--orange); }
    .alert-lym { background:#1a1600; border:1px solid var(--gold); color:var(--gold); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:flex; align-items:flex-end; padding-bottom:var(--safe-bottom); }
    .modal { background:#161616; border:1px solid var(--border); border-radius:20px 20px 0 0; padding:24px 20px; width:100%; max-height:90vh; overflow-y:auto; animation:slideUp 0.25s ease; }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--lym); margin-bottom:18px; letter-spacing:1px; }
    .modal-actions { display:flex; gap:10px; margin-top:18px; }
    .form-group { margin-bottom:12px; }
    .form-label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:5px; }
    .form-input { width:100%; background:#0d0d0d; border:1px solid var(--border); border-radius:8px; padding:11px 12px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:16px; outline:none; appearance:none; -webkit-appearance:none; }
    .form-input:focus { border-color:var(--lym); }
    .form-input option { background:#0d0d0d; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    textarea.form-input { resize:vertical; min-height:70px; font-size:14px; }
    .divider { border:none; border-top:1px solid var(--border); margin:14px 0; }
    .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
    .empty-icon { font-size:40px; margin-bottom:10px; }
    .loading { text-align:center; padding:40px; color:var(--muted); }

    /* IMPACT REPORT */
    .impact-report { background:linear-gradient(135deg,#1a1600 0%,#0a0a14 100%); border:1px solid var(--lym); border-radius:14px; padding:20px; margin-bottom:16px; }
    .impact-report-title { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--lym); letter-spacing:1px; margin-bottom:14px; }
    .impact-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(74,144,217,0.2); font-size:14px; }
    .impact-row:last-child { border-bottom:none; }
    .impact-row-label { color:var(--muted); }
    .impact-row-val { font-weight:600; color:var(--white); }

    /* GRANT TRACKER */
    .grant-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:8px; }
    .grant-name { font-weight:700; font-size:15px; margin-bottom:4px; }
    .grant-meta { font-size:12px; color:var(--muted); margin-bottom:8px; }
    .grant-progress { background:var(--border); border-radius:4px; height:6px; margin-bottom:6px; }
    .grant-progress-fill { background:var(--lym); border-radius:4px; height:6px; transition:width 0.3s; }
    .grant-status { font-size:11px; font-weight:600; text-transform:uppercase; }
    .status-prospect { color:var(--muted); }
    .status-applied { color:var(--orange); }
    .status-awarded { color:var(--green); }
    .status-denied { color:var(--red); }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-logo-wrap">
      <img src="IMG_6581.jpeg" style="width:160px;max-width:75%;filter:invert(1);display:block" alt="LeaveYourMark Foundation" />
      <div class="logo-sub">Foundation Admin</div>
    </div>
    <div class="header-action-bar" id="header-action"></div>
  </div>
  <div class="content" id="content"><div class="loading">Loading...</div></div>
  <nav class="bottom-nav">
    <button onclick="navigate('dashboard')" id="nav-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button onclick="navigate('donations')" id="nav-donations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Donations
    </button>
    <button onclick="navigate('scholarships')" id="nav-scholarships">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      Scholarships
    </button>
    <button onclick="navigate('grants')" id="nav-grants">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Grants
    </button>
    <button onclick="navigate('impact')" id="nav-impact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Impact
    </button>
  </nav>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, setDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  // ── REPLACE WITH LYM FIREBASE CONFIG ─────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyDpzZKJ09Le_MC1oVoi4bkBaGfbrMKilus",
    authDomain: "lymf-foundation.firebaseapp.com",
    projectId: "lymf-foundation",
    storageBucket: "lymf-foundation.firebasestorage.app",
    messagingSenderId: "577499898060",
    appId: "1:577499898060:web:42b57bc24b58ce941ae269",
  };
  // ─────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let donations = [], scholarships = [], grants = [], programs = [];
  let stats = { totalDonations:0, scholarshipsAwarded:0, totalDonors:0, youthServed:0, totalGrants:0 };
  let currentTab = "dashboard";

  // Real-time listeners
  onSnapshot(collection(db,"donations"), snap => { donations=snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,"scholarships"), snap => { scholarships=snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,"grants"), snap => { grants=snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,"programs"), snap => { programs=snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  onSnapshot(doc(db,"lym_stats","main"), snap => { if(snap.exists()) stats=snap.data(); render(); });

  function fmtDate(d) {
    if (!d) return "";
    const date = d.toDate ? d.toDate() : new Date(d);
    return date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  }
  function fmtCurrency(n) { return "$" + Number(n||0).toLocaleString(); }

  function navigate(tab) {
    currentTab = tab;
    document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
    document.getElementById("nav-"+tab)?.classList.add("active");
    render();
  }
  window.navigate = navigate;

  function render() {
    const content = document.getElementById("content");
    const ha = document.getElementById("header-action");
    ha.innerHTML = "";
    if (currentTab==="dashboard") renderDashboard(content);
    else if (currentTab==="donations") renderDonations(content, ha);
    else if (currentTab==="scholarships") renderScholarships(content, ha);
    else if (currentTab==="grants") renderGrants(content, ha);
    else if (currentTab==="impact") renderImpact(content, ha);
  }

  function renderDashboard(el) {
    const confirmedDonations = donations.filter(d=>d.status==="confirmed");
    const totalRaised = confirmedDonations.reduce((s,d)=>s+Number(d.amount||0),0);
    const pendingDonations = donations.filter(d=>d.status==="pending");
    const pendingScholarships = scholarships.filter(s=>s.status==="pending");
    const awardedScholarships = scholarships.filter(s=>s.status==="awarded");
    const activeGrants = grants.filter(g=>g.status==="applied"||g.status==="prospect");
    const awardedGrants = grants.filter(g=>g.status==="awarded");
    const grantTotal = awardedGrants.reduce((s,g)=>s+Number(g.amount||0),0);
    const recentDonations = [...donations].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,5);

    el.innerHTML = `
      ${pendingDonations.length>0?`<div class="alert-banner alert-orange">💰 <b>${pendingDonations.length} donation${pendingDonations.length>1?"s":""} pending confirmation</b></div>`:""}
      ${pendingScholarships.length>0?`<div class="alert-banner alert-lym">🎓 <b>${pendingScholarships.length} scholarship application${pendingScholarships.length>1?"s":""}</b> — needs review</div>`:""}

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Raised</div><div class="stat-value lym">${fmtCurrency(totalRaised)}</div></div>
        <div class="stat-card"><div class="stat-label">Total Donors</div><div class="stat-value gold">${confirmedDonations.length}</div></div>
        <div class="stat-card"><div class="stat-label">Scholarships Awarded</div><div class="stat-value green">${awardedScholarships.length}</div></div>
        <div class="stat-card"><div class="stat-label">Grants Secured</div><div class="stat-value" style="color:#b066ff">${fmtCurrency(grantTotal)}</div></div>
      </div>

      <div class="section-hd"><div class="section-title">Recent Donations</div></div>
      <div class="card-list">
        ${recentDonations.length===0?`<div class="empty"><div class="empty-icon">💙</div>No donations yet. Share your donation page!</div>`:""}
        ${recentDonations.map(d=>`<div class="item-card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div class="item-name">${d.anonymous?"Anonymous":`${d.firstName||""} ${d.lastName||""}`}</div>
              <div class="item-sub">${d.organization?`<span>${d.organization}</span>`:""}<span class="badge badge-${d.status==="confirmed"?"confirmed":"pending"}">${d.status}</span></div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--lym)">${fmtCurrency(d.amount)}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtDate(d.createdAt)}</div>
            </div>
          </div>
        </div>`).join("")}
      </div>`;
  }

  function renderDonations(el, ha) {
    ha.innerHTML = `<button class="btn btn-lym btn-sm" onclick="window._openAddDonation()">+ Log Donation</button>`;
    const sorted = [...donations].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    el.innerHTML = `
      <div class="card-list">
        ${sorted.length===0?`<div class="empty"><div class="empty-icon">💙</div>No donations yet.</div>`:""}
        ${sorted.map(d=>`<div class="item-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div>
              <div class="item-name">${d.anonymous?"Anonymous":`${d.firstName||""} ${d.lastName||""}`}</div>
              <div class="item-sub">
                ${d.organization?`<span>${d.organization}</span>`:""}
                <span class="badge badge-${d.status==="confirmed"?"confirmed":"pending"}">${d.status}</span>
              </div>
            </div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--lym)">${fmtCurrency(d.amount)}</div>
          </div>
          ${d.email?`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">✉️ ${d.email}${d.phone?" · 📞 "+d.phone:""}</div>`:""}
          ${d.dedication?`<div style="font-size:12px;color:var(--lym);margin-bottom:8px">🎗️ ${d.dedication.type} ${d.dedication.name}</div>`:""}
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${d.status!=="confirmed"?`<button class="btn btn-green btn-sm" onclick="window._confirmDonation('${d.id}')">✓ Confirm Payment</button>`:""}
            <button class="btn btn-outline btn-sm" onclick="window._editDonation('${d.id}')">Edit</button>
          </div>
        </div>`).join("")}
      </div>`;
  }

  function renderScholarships(el, ha) {
    ha.innerHTML = `<button class="btn btn-lym btn-sm" onclick="window._openAddScholarship()">+ Award Scholarship</button>`;
    const sorted = [...scholarships].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    el.innerHTML = `
      <div class="card-list">
        ${sorted.length===0?`<div class="empty"><div class="empty-icon">🎓</div>No scholarships yet.</div>`:""}
        ${sorted.map(s=>`<div class="item-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <div>
              <div class="item-name">${s.playerName||""}</div>
              <div class="item-sub">
                <span class="badge badge-scholarship">${s.status||"pending"}</span>
                ${s.program?`<span>${s.program}</span>`:""}
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--lym)">${fmtCurrency(s.amount)}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtDate(s.createdAt)}</div>
            </div>
          </div>
          ${s.parentName?`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">👤 ${s.parentName}${s.parentPhone?" · "+s.parentPhone:""}${s.parentEmail?" · "+s.parentEmail:""}</div>`:""}
          ${s.notes?`<div style="font-size:12px;color:var(--muted);margin-bottom:8px;background:#0d0d0d;padding:8px;border-radius:6px">📝 ${s.notes}</div>`:""}
          <div style="display:flex;gap:6px">
            ${s.status==="pending"?`<button class="btn btn-gold btn-sm" onclick="window._awardScholarship('${s.id}')">✓ Award</button>`:""}
            ${s.status==="pending"?`<button class="btn btn-red btn-sm" onclick="window._denyScholarship('${s.id}')">✗ Deny</button>`:""}
          </div>
        </div>`).join("")}
      </div>`;
  }

  function renderGrants(el, ha) {
    ha.innerHTML = `<button class="btn btn-lym btn-sm" onclick="window._openAddGrant()">+ Add Grant</button>`;
    const statusOrder = { prospect:0, applied:1, awarded:2, denied:3 };
    const sorted = [...grants].sort((a,b)=>(statusOrder[a.status]||0)-(statusOrder[b.status]||0));
    el.innerHTML = `
      ${sorted.length===0?`<div class="empty"><div class="empty-icon">🏛️</div>No grants tracked yet.</div>`:""}
      ${sorted.map(g=>{
        const pct = g.amount && g.requested ? Math.min(100, Math.round(Number(g.amount)/Number(g.requested)*100)) : 0;
        return `<div class="grant-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div class="grant-name">${g.funder||""}</div>
              <div class="grant-meta">${g.program||""} · Applied ${fmtDate(g.appliedDate)||"—"}</div>
            </div>
            <div style="text-align:right">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold)">${fmtCurrency(g.amount||g.requested)}</div>
              <div class="grant-status status-${g.status||"prospect"}">${(g.status||"prospect").toUpperCase()}</div>
            </div>
          </div>
          ${g.requested && g.amount ? `<div class="grant-progress"><div class="grant-progress-fill" style="width:${pct}%"></div></div>` : ""}
          ${g.notes?`<div style="font-size:12px;color:var(--muted);margin-top:6px">📝 ${g.notes}</div>`:""}
          <div style="display:flex;gap:6px;margin-top:8px">
            <button class="btn btn-outline btn-sm" onclick="window._editGrant('${g.id}')">Edit</button>
            ${g.status!=="awarded"?`<button class="btn btn-gold btn-sm" onclick="window._awardGrant('${g.id}')">Mark Awarded</button>`:""}
          </div>
        </div>`;
      }).join("")}`;
  }

  function renderImpact(el, ha) {
    ha.innerHTML = `<button class="btn btn-lym btn-sm" onclick="window._openAddProgram()">+ Add Program</button>`;
    const confirmedDonations = donations.filter(d=>d.status==="confirmed");
    const totalRaised = confirmedDonations.reduce((s,d)=>s+Number(d.amount||0),0);
    const awardedScholarships = scholarships.filter(s=>s.status==="awarded");
    const scholarshipTotal = awardedScholarships.reduce((s,sc)=>s+Number(sc.amount||0),0);
    const grantTotal = grants.filter(g=>g.status==="awarded").reduce((s,g)=>s+Number(g.amount||0),0);
    const corporateDonors = confirmedDonations.filter(d=>d.organization).length;

    el.innerHTML = `
      <div class="impact-report">
        <div class="impact-report-title">📊 Impact Report</div>
        <div class="impact-row"><span class="impact-row-label">Total Funds Raised</span><span class="impact-row-val" style="color:var(--lym)">${fmtCurrency(totalRaised + grantTotal)}</span></div>
        <div class="impact-row"><span class="impact-row-label">Individual Donations</span><span class="impact-row-val">${fmtCurrency(totalRaised)}</span></div>
        <div class="impact-row"><span class="impact-row-label">Grants Secured</span><span class="impact-row-val" style="color:var(--gold)">${fmtCurrency(grantTotal)}</span></div>
        <div class="impact-row"><span class="impact-row-label">Scholarships Awarded</span><span class="impact-row-val">${awardedScholarships.length} youth</span></div>
        <div class="impact-row"><span class="impact-row-label">Scholarship Dollars</span><span class="impact-row-val" style="color:var(--green)">${fmtCurrency(scholarshipTotal)}</span></div>
        <div class="impact-row"><span class="impact-row-label">Total Donors</span><span class="impact-row-val">${confirmedDonations.length}</span></div>
        <div class="impact-row"><span class="impact-row-label">Corporate Partners</span><span class="impact-row-val">${corporateDonors}</span></div>
        <div class="impact-row"><span class="impact-row-label">Programs Running</span><span class="impact-row-val">${programs.length}</span></div>
        <div class="impact-row"><span class="impact-row-label">Partner Organization</span><span class="impact-row-val">HoopNerdz Academy</span></div>
      </div>

      <div class="section-hd"><div class="section-title">Programs & Events</div></div>
      <div class="card-list">
        ${programs.length===0?`<div class="empty"><div class="empty-icon">📋</div>No programs added yet.</div>`:""}
        ${programs.map(p=>`<div class="item-card">
          <div class="item-name">${p.name||""}</div>
          <div class="item-sub" style="margin-top:4px">
            <span>${p.type||""}</span>
            <span>${fmtDate(p.date)}</span>
            ${p.youthServed?`<span style="color:var(--green)">${p.youthServed} youth served</span>`:""}
          </div>
          ${p.description?`<div style="font-size:12px;color:var(--muted);margin-top:6px">${p.description}</div>`:""}
        </div>`).join("")}
      </div>`;
  }

  // ── HANDLERS ────────────────────────────────────────────────
  window._confirmDonation = async (id) => {
    await updateDoc(doc(db,"donations",id),{status:"confirmed"});
    // Update stats
    const d = donations.find(x=>x.id===id);
    const newTotal = donations.filter(x=>x.status==="confirmed").reduce((s,x)=>s+Number(x.amount||0),0) + Number(d?.amount||0);
    await setDoc(doc(db,"lym_stats","main"),{ ...stats, totalDonations:newTotal, totalDonors:(stats.totalDonors||0)+1 },{merge:true});
  };

  window._openAddDonation = () => {
    showModal(`
      <div class="modal-title">Log Donation</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">First Name</label><input class="form-input" id="d-first" placeholder="First name" /></div>
        <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" id="d-last" placeholder="Last name" /></div>
      </div>
      <div class="form-group"><label class="form-label">Organization</label><input class="form-input" id="d-org" placeholder="Company/org (optional)" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount ($) *</label><input class="form-input" id="d-amount" type="number" placeholder="Amount" /></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-input" id="d-status">
            <option value="confirmed">Confirmed</option>
            <option value="pending">Pending</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="d-email" type="email" placeholder="email" /></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="d-phone" type="tel" placeholder="phone" /></div>
      </div>
      <div class="form-group"><label class="form-label">Type</label>
        <select class="form-input" id="d-type">
          <option>Individual</option>
          <option>Corporate</option>
          <option>Grant</option>
          <option>Event</option>
          <option>In-Kind</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="d-notes" placeholder="Any notes..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitAddDonation()">Add Donation</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitAddDonation = async () => {
    const amount = Number(document.getElementById("d-amount")?.value);
    if (!amount) return;
    await addDoc(collection(db,"donations"),{
      firstName: document.getElementById("d-first")?.value||"",
      lastName: document.getElementById("d-last")?.value||"",
      organization: document.getElementById("d-org")?.value||"",
      amount, status: document.getElementById("d-status")?.value||"confirmed",
      email: document.getElementById("d-email")?.value||"",
      phone: document.getElementById("d-phone")?.value||"",
      type: document.getElementById("d-type")?.value||"Individual",
      notes: document.getElementById("d-notes")?.value||"",
      anonymous: false, createdAt: new Date(), source: "manual",
    });
    window.closeModal(); navigate("donations");
  };

  window._editDonation = (id) => {
    const d = donations.find(x=>x.id===id);
    if (!d) return;
    showModal(`
      <div class="modal-title">Edit Donation</div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="form-input" id="ed-status">
          <option value="confirmed" ${d.status==="confirmed"?"selected":""}>Confirmed</option>
          <option value="pending" ${d.status==="pending"?"selected":""}>Pending</option>
          <option value="refunded" ${d.status==="refunded"?"selected":""}>Refunded</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="ed-amount" type="number" value="${d.amount||""}" /></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="ed-notes">${d.notes||""}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitEditDonation('${id}')">Save</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitEditDonation = async (id) => {
    await updateDoc(doc(db,"donations",id),{
      status: document.getElementById("ed-status")?.value,
      amount: Number(document.getElementById("ed-amount")?.value),
      notes: document.getElementById("ed-notes")?.value||"",
    });
    window.closeModal();
  };

  window._openAddScholarship = () => {
    showModal(`
      <div class="modal-title">Award Scholarship</div>
      <div class="form-group"><label class="form-label">Player Name *</label><input class="form-input" id="s-player" placeholder="Player full name" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount ($)</label><input class="form-input" id="s-amount" type="number" placeholder="e.g. 200" /></div>
        <div class="form-group"><label class="form-label">Program</label><input class="form-input" id="s-program" placeholder="e.g. HoopNerdz Academy" /></div>
      </div>
      <div class="form-group"><label class="form-label">Parent Name</label><input class="form-input" id="s-parent" placeholder="Parent/guardian name" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Parent Phone</label><input class="form-input" id="s-phone" type="tel" placeholder="phone" /></div>
        <div class="form-group"><label class="form-label">Parent Email</label><input class="form-input" id="s-email" type="email" placeholder="email" /></div>
      </div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="form-input" id="s-status">
          <option value="awarded">Awarded</option>
          <option value="pending">Pending Review</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="s-notes" placeholder="Reason, circumstances..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitAddScholarship()">Award Scholarship</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitAddScholarship = async () => {
    const player = document.getElementById("s-player")?.value.trim();
    if (!player) return;
    await addDoc(collection(db,"scholarships"),{
      playerName: player,
      amount: Number(document.getElementById("s-amount")?.value||0),
      program: document.getElementById("s-program")?.value||"HoopNerdz Academy",
      parentName: document.getElementById("s-parent")?.value||"",
      parentPhone: document.getElementById("s-phone")?.value||"",
      parentEmail: document.getElementById("s-email")?.value||"",
      status: document.getElementById("s-status")?.value||"awarded",
      notes: document.getElementById("s-notes")?.value||"",
      createdAt: new Date(),
    });
    await setDoc(doc(db,"lym_stats","main"),{...stats, scholarshipsAwarded:(stats.scholarshipsAwarded||0)+1, youthServed:(stats.youthServed||0)+1},{merge:true});
    window.closeModal(); navigate("scholarships");
  };

  window._awardScholarship = async (id) => {
    await updateDoc(doc(db,"scholarships",id),{status:"awarded"});
    await setDoc(doc(db,"lym_stats","main"),{...stats,scholarshipsAwarded:(stats.scholarshipsAwarded||0)+1},{merge:true});
  };

  window._denyScholarship = async (id) => {
    await updateDoc(doc(db,"scholarships",id),{status:"denied"});
  };

  window._openAddGrant = () => {
    showModal(`
      <div class="modal-title">Add Grant</div>
      <div class="form-group"><label class="form-label">Funder / Organization *</label><input class="form-input" id="g-funder" placeholder="e.g. Fifth Third Bank" /></div>
      <div class="form-group"><label class="form-label">Grant Program</label><input class="form-input" id="g-program" placeholder="e.g. Community Impact Grant" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Amount Requested ($)</label><input class="form-input" id="g-requested" type="number" placeholder="5000" /></div>
        <div class="form-group"><label class="form-label">Amount Awarded ($)</label><input class="form-input" id="g-amount" type="number" placeholder="0 if pending" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date Applied</label><input class="form-input" id="g-date" type="date" /></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-input" id="g-status">
            <option value="prospect">Prospect</option>
            <option value="applied">Applied</option>
            <option value="awarded">Awarded</option>
            <option value="denied">Denied</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Deadline</label><input class="form-input" id="g-deadline" type="date" /></div>
      <div class="form-group"><label class="form-label">Notes / Requirements</label><textarea class="form-input" id="g-notes" placeholder="Reporting requirements, contacts, etc."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitAddGrant()">Add Grant</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitAddGrant = async () => {
    const funder = document.getElementById("g-funder")?.value.trim();
    if (!funder) return;
    await addDoc(collection(db,"grants"),{
      funder, program: document.getElementById("g-program")?.value||"",
      requested: Number(document.getElementById("g-requested")?.value||0),
      amount: Number(document.getElementById("g-amount")?.value||0),
      appliedDate: document.getElementById("g-date")?.value||"",
      deadline: document.getElementById("g-deadline")?.value||"",
      status: document.getElementById("g-status")?.value||"prospect",
      notes: document.getElementById("g-notes")?.value||"",
      createdAt: new Date(),
    });
    window.closeModal(); navigate("grants");
  };

  window._editGrant = (id) => {
    const g = grants.find(x=>x.id===id);
    if (!g) return;
    showModal(`
      <div class="modal-title">Edit Grant</div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="form-input" id="eg-status">
          <option value="prospect" ${g.status==="prospect"?"selected":""}>Prospect</option>
          <option value="applied" ${g.status==="applied"?"selected":""}>Applied</option>
          <option value="awarded" ${g.status==="awarded"?"selected":""}>Awarded</option>
          <option value="denied" ${g.status==="denied"?"selected":""}>Denied</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Amount Awarded ($)</label><input class="form-input" id="eg-amount" type="number" value="${g.amount||""}" /></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="eg-notes">${g.notes||""}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitEditGrant('${id}')">Save</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitEditGrant = async (id) => {
    await updateDoc(doc(db,"grants",id),{
      status: document.getElementById("eg-status")?.value,
      amount: Number(document.getElementById("eg-amount")?.value||0),
      notes: document.getElementById("eg-notes")?.value||"",
    });
    window.closeModal();
  };

  window._awardGrant = async (id) => {
    const g = grants.find(x=>x.id===id);
    await updateDoc(doc(db,"grants",id),{status:"awarded"});
    await setDoc(doc(db,"lym_stats","main"),{...stats,totalGrants:(stats.totalGrants||0)+Number(g?.requested||0)},{merge:true});
  };

  window._openAddProgram = () => {
    showModal(`
      <div class="modal-title">Add Program / Event</div>
      <div class="form-group"><label class="form-label">Program Name *</label><input class="form-input" id="p-name" placeholder="e.g. Summer Hoops Camp" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Type</label>
          <select class="form-input" id="p-type">
            <option>Training Program</option>
            <option>Community Event</option>
            <option>Tournament</option>
            <option>Camp</option>
            <option>Workshop</option>
            <option>Fundraiser</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Date</label><input class="form-input" id="p-date" type="date" /></div>
      </div>
      <div class="form-group"><label class="form-label">Youth Served</label><input class="form-input" id="p-youth" type="number" placeholder="Number of youth" /></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="p-desc" placeholder="What happened, outcomes..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-lym" style="flex:1" onclick="window._submitAddProgram()">Add Program</button>
        <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      </div>`);
  };

  window._submitAddProgram = async () => {
    const name = document.getElementById("p-name")?.value.trim();
    if (!name) return;
    const youth = Number(document.getElementById("p-youth")?.value||0);
    await addDoc(collection(db,"programs"),{
      name, type: document.getElementById("p-type")?.value||"",
      date: document.getElementById("p-date")?.value||"",
      youthServed: youth,
      description: document.getElementById("p-desc")?.value||"",
      createdAt: new Date(),
    });
    if (youth > 0) await setDoc(doc(db,"lym_stats","main"),{...stats,youthServed:(stats.youthServed||0)+youth},{merge:true});
    window.closeModal(); navigate("impact");
  };

  function showModal(html) {
    window.closeModal();
    const b = document.createElement("div");
    b.className="modal-backdrop"; b.id="modal-backdrop";
    b.innerHTML=`<div class="modal">${html}</div>`;
    b.addEventListener("click",e=>{if(e.target===b)window.closeModal();});
    document.body.appendChild(b);
  }
  window.closeModal = () => document.getElementById("modal-backdrop")?.remove();

  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  navigate("dashboard");
</script>
</body>
</html>
